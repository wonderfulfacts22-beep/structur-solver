    let currentModel = null;
    let currentResults = null;
    let resultsManager = null;
    let diagramModal = null;

    function loadResultsFromStorage() {
      try {
        const stored = localStorage.getItem('tanti_hit_fea_results');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && parsed.results && parsed.model) {
            currentModel = parsed.model;
            currentResults = parsed.results;
            updateUI();
            return true;
          }
        }
      } catch (e) {
        console.error('Error loading stored results:', e);
      }
      return false;
    }

    function updateUI() {
      if (!currentModel || !currentResults) return;

      const pName = document.getElementById('results-project-name');
      if (pName) {
        pName.innerText = currentModel.name || 'Grillage Project';
      }

      const pBadge = document.getElementById('results-status-badge');
      if (pBadge && currentResults) {
        const eq = currentResults.equilibrium;
        const passed = eq && eq.equilibriumPassed;
        pBadge.innerText = `Solved (${currentResults.totalDof} DOFs) - Equilibrium ${passed ? 'OK' : 'Warning'}`;
        pBadge.className = `text-xs font-mono px-2.5 py-1 rounded-lg ${passed ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-amber-950 text-amber-300 border border-amber-800'} font-bold shadow-xs`;
      }

      if (resultsManager) {
        resultsManager.setResults(currentResults, currentModel);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('results-content-container');
      diagramModal = new Ku();
      resultsManager = new Gu(container, (memberId) => {
        diagramModal.show(memberId, currentModel, currentResults);
      });

      const loaded = loadResultsFromStorage();
      if (!loaded) {
        container.innerHTML = `
          <div class="p-12 text-center text-[#757168] font-mono text-sm bg-white m-auto">
            <span class="text-4xl block mb-3">📊</span>
            <h3 class="text-base font-bold text-[#191c19] mb-1">No Active Analysis Results</h3>
            <p class="mb-4">Please return to the main 3D model screen and click <strong class="text-[#F95C4B]">"Run Analysis"</strong> (Ctrl+Enter).</p>
            <button onclick="window.location.href='index.html'" class="px-4 py-2 bg-[#F95C4B] hover:bg-[#e04635] text-white font-bold rounded-lg transition shadow-xs text-xs cursor-pointer">
              ← Return to 3D Model
            </button>
          </div>
        `;
        document.getElementById('results-project-name').innerText = 'No Model';
        const badge = document.getElementById('results-status-badge');
        badge.innerText = 'Unsolved';
        badge.className = 'text-xs font-mono px-2.5 py-1 rounded-lg bg-amber-950 text-amber-300 border border-amber-800 font-bold shadow-xs';
      }

      // Actions
      document.getElementById('refresh-results-btn')?.addEventListener('click', () => {
        if (loadResultsFromStorage()) {
          console.log('Results reloaded from storage');
        } else {
          alert('No updated results found in storage. Please solve the model on the main screen.');
        }
      });

      document.getElementById('export-report-btn')?.addEventListener('click', () => {
        if (!currentResults) {
          alert('Please run analysis first.');
          return;
        }
        qu.generateReport(currentModel, currentResults, currentModel.name || 'Grillage Structural Analysis');
      });

      document.getElementById('export-json-btn')?.addEventListener('click', () => {
        if (!currentModel) return;
        qu.exportJSON(currentModel, currentModel.name || 'Grillage_Model');
      });

      document.getElementById('back-to-model-btn')?.addEventListener('click', () => {
        if (window.opener) {
          window.close();
        } else {
          window.location.href = 'index.html';
        }
      });

      // Storage event listener for live sync
      window.addEventListener('storage', (e) => {
        if (e.key === 'tanti_hit_fea_results') {
          loadResultsFromStorage();
        }
      });
    });
  </script>
